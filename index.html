<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async
      src="https://www.googletagmanager.com/gtag/js?id=G-FPB12WGHVE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FPB12WGHVE');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="author" content="The Fista Media Group" />
    <meta name="publisher" content="The Fista" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="New Delhi, India" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Per-page SEO (title, description, canonical, Open Graph, Twitter, JSON-LD).
         The prerender step replaces this block for every route. -->
    <!--seo-start-->
    <title>The Fista — India's Trusted News Platform</title>
    <meta name="description"
      content="The Fista is India's trusted news platform — credible, in-depth coverage of cricket, politics, business, health, Bollywood, education and technology." />
    <link rel="canonical" href="https://thefista.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Fista" />
    <meta property="og:title" content="The Fista — India's Trusted News Platform" />
    <meta property="og:description"
      content="The Fista is India's trusted news platform — credible, in-depth coverage of cricket, politics, business, health, Bollywood, education and technology." />
    <meta property="og:url" content="https://thefista.in/" />
    <meta property="og:image" content="https://thefista.in/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Fista — India's Trusted News Platform" />
    <meta name="twitter:image" content="https://thefista.in/og-default.png" />
    <!--seo-end-->

    <!-- Times New Roman is the house face. Tinos (metric-compatible with Times
         New Roman) only loads where the system font is missing, e.g. Android. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet" />
  </head>
